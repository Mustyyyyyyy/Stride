version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: stride
      POSTGRES_PASSWORD: stride
      POSTGRES_DB: stridedb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stride -d stridedb"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: always
    ports:
      - "3004:3004"
    environment:
      DATABASE_URL: "postgresql://stride:stride@postgres:5432/stridedb?sslmode=require"
      PORT: "3004"
      NODE_ENV: "production"
      JWT_SECRET: "change-me-in-production"
      JWT_EXPIRATION: "15m"
      JWT_REFRESH_SECRET: "change-me-in-production-too"
      JWT_REFRESH_EXPIRATION: "30d"
      CORS_ORIGIN: "http://localhost:5173"
      USE_DEMO: "false"
    depends_on:
      postgres:
        condition: service_healthy
    command: ["sh", "-c", "npx prisma migrate deploy && node dist/main"]

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    restart: always
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  postgres_data:
