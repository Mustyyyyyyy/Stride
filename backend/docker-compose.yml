version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: stride_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: stride_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: always

  backend:
    build: .
    container_name: stride_backend
    environment:
      PORT: 3001
      DATABASE_URL: "postgresql://postgres:postgres@postgres:5432/stride_db?schema=public"
      JWT_SECRET: "stride_super_secret_jwt_access_key_2026"
    ports:
      - "3001:3001"
    depends_on:
      - postgres

volumes:
  pgdata:
